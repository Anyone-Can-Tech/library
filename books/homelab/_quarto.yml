project:
  type: book
  output-dir: _book
  pre-render: python3 ../../shared/scripts/credits.py

book:
  title: "Anyone Can Homelab"
  subtitle: "A complete beginner's guide to running your own services at home"
  author: "Michael McNees and contributors"
  date: today
  site-url: https://anyonecanhomelab.com
  repo-url: https://github.com/Anyone-Can-Tech/library
  repo-subdir: books/homelab
  repo-branch: main
  repo-actions: [edit, issue]
  downloads: [pdf, epub]
  search: true
  page-footer:
    left: "Text CC BY-SA 4.0. Lab code MIT."
    right:
      - text: "Sponsor"
        href: https://github.com/sponsors/Anyone-Can-Tech
      - icon: github
        href: https://github.com/Anyone-Can-Tech/library
  chapters:
    - index.qmd
    - foreword.qmd
    - part: "Getting Started"
      chapters:
        - chapters/01-why-bother.qmd
        - chapters/02-hardware.qmd
    - part: "Foundations"
      chapters:
        - chapters/03-networking-without-fear.qmd
        - chapters/04-meet-the-terminal.qmd
        - chapters/05-containers.qmd
    - part: "Your First Services"
      chapters:
        - chapters/06-ad-blocking.qmd
        - chapters/07-media-server.qmd
        - chapters/08-minecraft-server.qmd
        - chapters/09-a-front-door.qmd
    - part: "Running It for Real"
      chapters:
        - chapters/10-keeping-it-alive.qmd
        - chapters/11-leaving-the-house-safely.qmd
    - chapters/12-where-next.qmd
  appendices:
    - appendices/a-your-first-contribution.qmd

filters:
  - ../../shared/filters/include-code.lua

shortcodes:
  - ../../shared/shortcodes/credits.lua

format:
  html:
    theme:
      light: [cosmo, ../../shared/styles/series.scss]
    toc: true
    code-copy: true
    code-overflow: wrap
  epub:
    toc: true
  typst:
    section-numbering: 1.1.1
