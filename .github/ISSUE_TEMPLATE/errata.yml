name: Something in the book is wrong
description: Typos, unclear steps, outdated screenshots, or anything that tripped you up.
labels: ["errata", "good first issue"]
body:
  - type: dropdown
    id: book
    attributes:
      label: Which book?
      options:
        - Anyone Can Homelab
        - Anyone Can Code
        - Anyone Can Linux
        - Anyone Can Network
        - Anyone Can Protect
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Chapter and section
      placeholder: "Chapter 6, The lab"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
      description: What did the book say, and what happened instead?
    validations:
      required: true
  - type: checkboxes
    id: fix
    attributes:
      label: Want to fix it yourself?
      options:
        - label: I'd like to try fixing this (we'll help you through your first pull request)
